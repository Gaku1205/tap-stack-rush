<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>TAP STACK RUSH ｜ 30秒の積み上げ勝負</title>
    <meta name="description" content="動くブロックが重なった瞬間にタップ。30秒でどこまで高く積めるか。称号つきの結果をシェアしよう。" />
    <meta property="og:title" content="TAP STACK RUSH ｜ 30秒の積み上げ勝負" />
    <meta property="og:description" content="親指1本、30秒。止めて、重ねて、空まで積め。" />
    <!-- 公開アドレス（SNS は相対URLを読まない） -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tap-stack-rush.vercel.app/" />
    <meta property="og:image" content="https://tap-stack-rush.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TAP STACK RUSH。止めて、重ねて、空まで積め。色とりどりのブロックが積み上がり、称号「雲をつかむ人」が添えられている" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://tap-stack-rush.vercel.app/og.png" />
    <meta name="theme-color" content="#FFE14D" />
    <style>
      html, body { margin: 0; height: 100%; background: #FFE14D; overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
      canvas { display: block; width: 100vw; height: 100dvh; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      .ui { position: fixed; top: 0; bottom: 0; pointer-events: none; font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic", YuGothic, Meiryo, system-ui, sans-serif; font-weight: 900; }
      .ui button { pointer-events: auto; font: inherit; cursor: pointer; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
      .ui button:focus-visible { outline: none; box-shadow: 0 0 0 3px #FFF6E5, 0 0 0 7px #141414; }
      .btn-icon { position: absolute; top: max(10px, env(safe-area-inset-top)); right: 10px; width: 48px; height: 48px; border-radius: 14px; border: 3px solid #141414; background: #FFF6E5; box-shadow: 0 4px 0 #141414; display: grid; place-items: center; padding: 0; }
      .btn-icon svg { width: 24px; height: 24px; fill: #141414; stroke: #141414; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .btn-icon:active { transform: translateY(3px); box-shadow: 0 1px 0 #141414; }
      .btn-start { position: absolute; left: 0; right: 0; background: transparent; border: 0; color: transparent; font-size: 1px; border-radius: 0; }
      .btn-start:focus-visible { box-shadow: inset 0 0 0 4px #FFF6E5; }
      .ui:not([data-scene="title"]) .btn-start { display: none; }
      .actions { position: absolute; left: 18px; right: 18px; bottom: max(44px, calc(env(safe-area-inset-bottom) + 34px)); display: none; gap: 12px; }
      .ui[data-scene="over"] .actions { display: flex; animation: up 0.4s 0.45s both cubic-bezier(.2,1.4,.4,1); }
      .btn { flex: 1; height: 60px; border-radius: 18px; border: 3px solid #141414; font-size: 18px; box-shadow: 0 6px 0 #141414; transition: transform 0.06s; }
      .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #141414; }
      .btn-main { background: #141414; color: #FFF6E5; box-shadow: 0 6px 0 #FFF6E5, 0 6px 0 3px #141414; flex: 1.25; }
      .btn-sub { background: #FFF6E5; color: #141414; }
      .toast { position: absolute; left: 50%; bottom: 120px; transform: translate(-50%, 10px); background: #141414; color: #FFF6E5; padding: 12px 18px; border-radius: 14px; font-size: 15px; opacity: 0; transition: opacity 0.2s, transform 0.2s; white-space: nowrap; }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }
      @keyframes up { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .ui[data-scene="over"] .actions { animation: none; } .toast, .btn { transition: none; } }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="TAP STACK RUSH のゲーム画面。タップかスペースキーでブロックを止める"></canvas>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
